apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile
resources:
  - namespace.yaml
  - storageclass.yaml
  - pv.yaml
  - pvc.yaml
  - sealed-secret.yaml      # generated by kubeseal — see runbook step 3.
                            # A missing file makes kustomize build fail loudly
                            # and ArgoCD go Unknown. That's the correct failure
                            # mode; a placeholder SealedSecret would sync
                            # Healthy and CrashLoop on decrypt instead.
  - configmap.yaml
  - mariadb.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml