apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-backend
  namespace: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  HTTP_ADDR: ":8080"
  HTTP_READ_HEADER_TIMEOUT: "5s"
  HTTP_READ_TIMEOUT: "10s"
  HTTP_WRITE_TIMEOUT: "10s"
  HTTP_IDLE_TIMEOUT: "60s"
  HTTP_SHUTDOWN_TIMEOUT: "15s"
  DB_MAX_CONNS: "5"
  DB_MIN_CONNS: "0"
  DB_CONNECT_TIMEOUT: "5s"
  DB_READINESS_TIMEOUT: "750ms"
  DB_QUERY_TIMEOUT: "3s"
  MAX_AUTHOR_CHARS: "80"
  MAX_COMMENT_CHARS: "2000"
  MAX_COMMENTS_PER_POST: "1000"
  VIEW_DEDUP_WINDOW_HOURS: "24"
  RATE_COMMENTS_PER_MIN: "5"
  RATE_LIKES_PER_MIN: "30"
  RATE_READS_PER_MIN: "60"
  RATE_LIMIT_MAX_KEYS: "10000"
  # Set this in GitOps to the actual Traefik/pod-network CIDRs. Never use 0.0.0.0/0.
  TRUSTED_PROXY_CIDRS: 
