apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
- configmap.yaml
- sealed-secret.yaml
- migration-job.yaml
- deployment.yaml
- service.yaml
- ingressroute.yaml
- content-sync-job.yaml
configMapGenerator:
  - name: portfolio-content-registry
    files:
      - content-registry.json=content-registry.json

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    
images:
- name: ghcr.io/home-compute-cluster/portfolio-backend
  newName: ghcr.io/home-compute-cluster/portfolio-backend
  newTag: 775a43c
