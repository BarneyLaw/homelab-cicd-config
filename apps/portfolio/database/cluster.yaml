apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portfolio-db
  namespace: portfolio
spec:
  instances: 1

  # MUST stay false while instances is 1. CNPG's primary PDB is minAvailable: 1
  # over a single pod, so disruptionsAllowed is 0 permanently and no eviction can
  # ever satisfy it. That wedges kured and stops ALL node patching, not just this
  # node's -- see apps/kured/values.yaml, "WHY DRAINS MUST BE ABLE TO SUCCEED".
  # Set back to true (or drop it) if instances ever goes to 2+, because then CNPG
  # can switch over and the PDB will permit eviction on its own.
  enablePDB: false
  # PIN THE MINOR VERSION. Never a floating major tag here.
  #
  # With `:18` plus the CNPG default imagePullPolicy IfNotPresent, the running
  # PostgreSQL minor is decided by whichever node the pod lands on and whenever
  # that node last pulled the tag -- not by this file. Observed 2026-09-21: the
  # operator upgrade rescheduled portfolio-db-1 onto legion-1, which still had a
  # months-old `:18` in its image cache, and PostgreSQL silently went 18.6 -> 18.4.
  # Upstream `:18` and `:18.6` were both sha256:899d3ed5 at the time; the digest
  # actually running was sha256:17760b45, matching no current tag at all.
  #
  # A silent minor DOWNGRADE means losing the security fixes you think you have,
  # and PostgreSQL does not guarantee older binaries are safe against a data
  # directory written by a newer minor. Bump this deliberately instead.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: portfolio
      owner: portfolio
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/portfolio-db
      endpointURL: http://192.168.1.248:3900
      s3Credentials:
        accessKeyId:
          name: backup-store-creds
          key: ACCESS_KEY
        secretAccessKey:
          name: backup-store-creds
          key: SECRET_KEY
      wal:
        compression: gzip
    retentionPolicy: "30d"
    # Propagated by SetInheritedDataAndOwnership() onto every object the operator
  # creates for this cluster — including the generated PodMonitor, which is the
  # only reason this is here. kube-prom's podMonitorSelector requires
  # release=kube-prom and CNPG does not otherwise set it, so the PodMonitor is
  # created, ArgoCD reports Synced, and nothing scrapes it.
  #
  # Side effect: the label also lands on pods, services, PVCs and secrets.
  inheritedMetadata:
    labels:
      release: kube-prom

  monitoring:
    enablePodMonitor: true
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cluster
        action: replace