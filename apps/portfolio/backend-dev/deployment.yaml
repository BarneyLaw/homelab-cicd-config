apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend-dev
  namespace: portfolio-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-backend-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-backend-dev
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # GitOps replaces this reference with an immutable release or commit tag.
          image: ghcr.io/home-compute-cluster/portfolio-backend-dev:git-sha
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portfolio-backend-dev
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-db-dev-app
                  key: uri
            - name: VISITOR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-backend-dev
                  key: VISITOR_HMAC_KEY
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
