# Dev twin of apps/portfolio/backend/ingressroute.yaml.
#
# NOTE the entrypoint differs from prod. Prod uses `web` because its traffic
# arrives through the cloudflared tunnel on localhost:80. This host is reached
# directly over TLS on the LAN, so it belongs on `websecure` — same as every
# other *.lab.packetcraft.dev route (argocd, headlamp, grafana, seafile).
# TLS is served from the default TLSStore's *.lab.packetcraft.dev wildcard.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-dev-public
  namespace: portfolio-dev
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`site-dev.lab.packetcraft.dev`) && PathPrefix(`/api`)
      priority: 100
      services:
        - name: portfolio-backend-dev
          port: http
  tls: {}

---
# NOTE: prod's admin route sits behind Cloudflare Access on the public tunnel.
# This host is internal-only, so no Access JWT ever arrives and CF_ACCESS_AUD /
# CF_ACCESS_TEAM_DOMAIN in the dev ConfigMap cannot validate. See the ConfigMap
# comment — either front this with its own Access application or disable the
# Access check in dev.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-dev-admin
  namespace: portfolio-dev
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`site-dev.lab.packetcraft.dev`) && PathPrefix(`/api/admin`)
      priority: 200
      services:
        - name: portfolio-backend-dev
          port: http
  tls: {}
