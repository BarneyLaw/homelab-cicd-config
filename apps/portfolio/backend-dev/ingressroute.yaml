# Dev twin of apps/portfolio/backend/ingressroute.yaml.
# Served on the internal *.lab.packetcraft.dev wildcard, NOT the public
# packetcraft.dev tunnel, so dev never competes with prod for a hostname.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-dev-public
  namespace: portfolio-dev
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`site-dev.lab.packetcraft.dev`) && PathPrefix(`/api`)
      priority: 100
      services:
        - name: portfolio-backend-dev
          port: http

---
# NOTE: prod's admin route sits behind Cloudflare Access on the public tunnel.
# This host is internal-only, so no Access JWT ever arrives and CF_ACCESS_AUD /
# CF_ACCESS_TEAM_DOMAIN in the dev ConfigMap cannot validate. See the ConfigMap
# comment — either front this with its own Access application or disable the
# Access check in dev.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-backend-dev-admin
  namespace: portfolio-dev
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`site-dev.lab.packetcraft.dev`) && PathPrefix(`/api/admin`)
      priority: 200
      services:
        - name: portfolio-backend-dev
          port: http
