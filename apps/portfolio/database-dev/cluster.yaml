# apps/portfolio/database-dev/cluster.yaml
#
# Dev twin of portfolio-db. Same engine and same database/owner names as prod,
# so app config differs only by host. Deliberately NOT prod:
#   - no backup/barmanObjectStore + no ScheduledBackup: dev data is disposable
#   - smaller volume
#
# Connection details are published by CNPG in the generated secret
# portfolio-db-dev-app (username / password / dbname / host / port / uri).
# Point dev workloads at portfolio-db-dev-rw.portfolio-dev.svc.cluster.local:5432
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portfolio-db-dev
  namespace: portfolio-dev
spec:
  instances: 1
  # Keep this on the same major version as portfolio-db.
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 2Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: portfolio
      owner: portfolio
    # Propagated by SetInheritedDataAndOwnership() onto every object the operator
  # creates for this cluster — including the generated PodMonitor, which is the
  # only reason this is here. kube-prom's podMonitorSelector requires
  # release=kube-prom and CNPG does not otherwise set it, so the PodMonitor is
  # created, ArgoCD reports Synced, and nothing scrapes it.
  #
  # Side effect: the label also lands on pods, services, PVCs and secrets.
  inheritedMetadata:
    labels:
      release: kube-prom

  monitoring:
    enablePodMonitor: true
    # Query-ConfigMap metrics are emitted with nil constLabels, so nothing
    # identifies which cluster they came from. Pod names churn on restart
    # (portfolio-db-1 -> -2), so `pod` is not a stable key either. Copy the
    # pod's cnpg.io/cluster label onto every sample from this scrape.
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cluster
        action: replace
