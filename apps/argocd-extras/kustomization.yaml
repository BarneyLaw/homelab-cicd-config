apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately no top-level `namespace:` — the PrometheusRule targets
# `monitoring` while the parent Application's destination is `argocd`. A global
# override here would silently relocate the rule out of the namespace
# kube-prom's ruleNamespaceSelector watches. Same reasoning as
# apps/traefik and apps/cloudflared.
resources:
  - prometheusrule.yaml
  - argocd-ingress.yaml