apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # Merged by K3s helm-controller over the packaged chart's own values.
  # Chart: traefik-39.0.701+up39.0.7 (upstream traefik-helm-chart v39.0.7)
  valuesContent: |-
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addServicesLabels: true
        addRoutersLabels: true
        buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10"
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          honorLabels: true
          additionalLabels:
            release: kube-prom