apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traefik-recording
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
    - name: traefik.service.sli
      interval: 30s
      rules:
        # Rules evaluate in order within a group, so the ratio below can
        # reference the two rates declared above it.
        - record: traefik_service:requests:rate5m
          expr: sum by (service) (rate(traefik_service_requests_total[5m]))

        - record: traefik_service:requests_5xx:rate5m
          expr: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))

        # NaN while idle (0/0). That is intentional: NaN > threshold is false,
        # so an idle service will not trip a future alert.
        - record: traefik_service:error_ratio:rate5m
          expr: |
            traefik_service:requests_5xx:rate5m
              / traefik_service:requests:rate5m

        # protocol!="websocket" is load-bearing. Websocket upgrades record
        # connection LIFETIME (with code="0"), not request latency. Including
        # them drags p95/p99 toward +Inf and makes Headlamp look broken.
        - record: traefik_service:duration_seconds:p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (service, le) (
                rate(traefik_service_request_duration_seconds_bucket{protocol!="websocket"}[5m])
              )
            )

        - record: traefik_service:duration_seconds:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum by (service, le) (
                rate(traefik_service_request_duration_seconds_bucket{protocol!="websocket"}[5m])
              )
            )

    - name: traefik.config.health
      interval: 30s
      rules:
        # Keep `pod` here rather than aggregating it away, so a single wedged
        # replica stays visible.
        - record: traefik:config_reload_lag_seconds
          expr: time() - traefik_config_last_reload_success

        - record: traefik:config_reloads:increase10m
          expr: increase(traefik_config_reloads_total[10m])

    - name: traefik.entrypoint.sli
      interval: 30s
      rules:
        # Entrypoint-level counters see EVERY request that enters Traefik,
        # including ones that match no router. Service-level counters only see
        # requests that reached a backend. The difference is the routing gap.
        - record: traefik:entrypoint_requests:rate5m
          expr: sum by (entrypoint) (rate(traefik_entrypoint_requests_total[5m]))

        # Requests that entered but never reached any service. A discarded
        # router (unresolvable backend reference) shows up here and NOWHERE
        # else — not in ArgoCD, not in the service SLIs, which simply stop
        # having a series for that route.
        #
        # clamp_min guards the scrape-skew case where service counters briefly
        # lead entrypoint counters and the subtraction goes negative.
        - record: traefik:unrouted_requests:rate5m
          expr: |
            clamp_min(
              sum(rate(traefik_entrypoint_requests_total[5m]))
                - sum(rate(traefik_service_requests_total[5m])),
              0
            )

        - record: traefik:entrypoint_requests_5xx:rate5m
          expr: |
            sum by (entrypoint) (
              rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])
            )