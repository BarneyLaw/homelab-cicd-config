configs:
  params:
    server.insecure: true          # THIS is where the insecure flag belongs

# ---------------------------------------------------------------------------
# Metrics
#
# Every component below needs BOTH:
#   metrics.enabled: true                  -> creates the -metrics Service
#   metrics.serviceMonitor.enabled: true   -> creates the ServiceMonitor
# Enabling only the first gives you an endpoint nothing scrapes; enabling only
# the second gives you a ServiceMonitor pointing at a Service that doesn't
# exist. Neither failure surfaces in ArgoCD — the app stays Synced/Healthy.
#
# `release: kube-prom` on every ServiceMonitor is mandatory. kube-prom's
# serviceMonitorSelector is {matchLabels: {release: kube-prom}}; without it the
# object is created, ArgoCD is green, and nothing is ever scraped.
#
# honorLabels deliberately left at the chart default (false). argocd_app_info
# and argocd_app_reconcile both carry their own `namespace` label meaning "the
# Application's namespace", which collides with the ServiceMonitor's target
# `namespace` label. Today both are `argocd` so the collision is invisible. If
# apps-in-any-namespace is ever enabled, the metric's label gets renamed to
# `exported_namespace` and every by-namespace query silently reports `argocd`
# for everything — same class of bug as the Traefik per-backend `service` label.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Scheduling
#
# No component below sets a nodeSelector, deliberately. ArgoCD is the control
# loop for the whole cluster: pinning all seven components to one node means
# rebooting that node stops every sync, including the sync that would move
# them. Nothing here is node-bound -- the controller, repo-server, server, dex,
# applicationSet and notifications are stateless, and the non-HA chart runs
# Redis with no persistence, so a rescheduled Redis just rebuilds its cache.
#
# Consequence to expect: because ArgoCD manages itself, a sync that moves the
# application-controller pod will look like it has hung partway through. It
# resumes once the new pod is up.
# ---------------------------------------------------------------------------

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prom
    applicationLabels:
      # Would add an argocd_app_labels series per Application. Off: we don't
      # label Applications with anything worth slicing dashboards by yet.
      enabled: false
    rules:
      # The chart can ship its own PrometheusRule, but it would land in the
      # `argocd` namespace and its examples are the generic upstream set.
      # Alerts are hand-authored in apps/argocd-extras/ instead, matching
      # longhorn-extras / cnpg-extras / cloudflared.
      enabled: false

# redis: no overrides. redis.metrics.enabled would add a redis_exporter
# sidecar; not enabled, because the signal that actually matters (is Redis
# serving the controller?) is already covered by
# argocd_redis_request_total{failed="true"}, which the controller and
# repo-server emit themselves. The exporter would add a container for keyspace
# stats we have no use for. Note this must stay commented out rather than
# written as a bare `redis:` key -- an empty key is null, and a null in a Helm
# values file deletes the chart's defaults for that component.

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prom

server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prom

# dex: no overrides. dex.metrics left off — no SSO configured, so dex is an
# idle pod. Turn on only if/when an OIDC provider is wired up. Same null
# caveat as redis above: keep this a comment, not an empty `dex:` key.

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        release: kube-prom

# notifications: no overrides (same null caveat as redis and dex above).
# notifications.metrics left off — the controller runs but no triggers or
# subscriptions are configured, so argocd_notifications_* would be flat zero.
# Enable alongside the first real notification trigger:
# notifications:
#   metrics:
#     enabled: true
#     serviceMonitor:
#       enabled: true
#       additionalLabels:
#         release: kube-prom