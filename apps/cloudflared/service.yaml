apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  clusterIP: None        # headless — nothing dials in, this exists only for the ServiceMonitor
  selector:
    app: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics