apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
- grafana-admin-sealedsecret.yaml
- grafana-ingress-tail.yaml
- scrapeconfig-nebula-gpu.yaml

configMapGenerator:
  - name: grafana-dashboard-homelab-overview
    files:
      - dashboards/homelab-overview.json
    options:
      labels:
        grafana_dashboard: "1"   # kube-prom Grafana sidecar watches for this label
  - name: grafana-dashboard-traefik
    files:
      - dashboards/traefik.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-longhorn
    files:
      - dashboards/longhorn.json
    options:
      labels:
        grafana_dashboard: "1"    
  - name: grafana-dashboard-cloudflared
    files:
      - dashboards/grafana-dashboard-cloudflared.json
    options:
      labels:
        grafana_dashboard: "1"  
  - name: grafana-dashboard-cnpg
    files:
      - dashboards/cnpg.json
    options:
      labels:
        grafana_dashboard: "1"
        
generatorOptions:
  # Without this, every edit renames the ConfigMap. The sidecar would then
  # briefly serve two copies of the same dashboard UID before the old one
  # is pruned. Stable names avoid that.
  disableNameSuffixHash: true