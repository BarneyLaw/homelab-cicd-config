apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lag-app
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`german.lab.packetcraft.dev`)
      services:
        - name: lag-app
          port: 80
  # Traefik serves the cluster's default *.lab.packetcraft.dev certificate.
  tls: {}
