# apps/penny-dev/database/ingressroute-tcp.yaml
#
# Publishes the CNPG primary at penny-dev.lab.packetcraft.dev:5432 through
# Traefik, the same front door as argocd/grafana/seafile, so this namespace
# does not need a LoadBalancer of its own.
#
# Two things differ from the HTTP IngressRoutes elsewhere in this repo:
#
#   - It is an IngressRouteTCP on a dedicated `postgres` entrypoint (added in
#     apps/traefik/helmchartconfig.yaml), because Postgres is not HTTP.
#   - The match is HostSNI(`*`), not a Host rule. Postgres negotiates TLS in
#     band via SSLRequest rather than opening with a TLS ClientHello, so no SNI
#     ever reaches Traefik to match against. The hostname is not enforced; the
#     port is what selects this database.
#
# There is deliberately no `tls:` block. Traefik proxies the bytes untouched and
# Postgres terminates TLS itself, which keeps CNPG's certificate -- and so
# sslmode=verify-full against the CNPG CA -- working end to end.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: penny-dev-db
  namespace: penny-dev
spec:
  entryPoints:
    - postgres
  routes:
    - match: HostSNI(`*`)
      services:
        - name: penny-dev-db-rw
          port: 5432
