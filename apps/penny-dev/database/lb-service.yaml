# apps/penny-dev/database/lb-service.yaml
#
# Publishes the CNPG primary on port 5432 outside the cluster so developers can
# reach it at penny-dev.lab.packetcraft.dev over Tailscale. Postgres speaks its
# own wire protocol and negotiates TLS with an in-band SSLRequest rather than a
# TLS ClientHello, so Traefik cannot route it by SNI the way the *.lab HTTP
# hosts are routed -- this needs a real L4 LoadBalancer, not an IngressRoute.
#
# The selector tracks instanceRole=primary, so on a failover the LB follows the
# new primary without any change here.
#
# This listens on 5432 on ALL five node IPs, not just the one the DNS record
# points at. That is K3s ServiceLB's default and it is deliberately left alone.
# The obvious-looking fix -- an `svccontroller.k3s.cattle.io/lbpool` annotation,
# which this file used to carry with the value `penny-dev-db` -- does nothing at
# all, for two reasons (see pkg/cloudprovider/servicelb.go in k3s):
#
#   1. lbpool is read from the Service's LABELS, not its annotations.
#   2. ServiceLB only applies a node selector if at least one node carries
#      `svccontroller.k3s.cattle.io/enablelb=true`. No node here does. Adding it
#      to deus would not scope this Service alone -- the gate is cluster-wide,
#      so every ServiceLB including Traefik's would immediately restrict to
#      labelled nodes, pulling ingress for every *.lab host off the other four.
#
# Narrowing the listener is therefore a cluster-wide node-labelling exercise,
# not a change to this file. It is also low value here: all five addresses are
# private and reachable only over the LAN or the tailnet, and pg_hba requires
# TLS plus SCRAM on every one of them.
apiVersion: v1
kind: Service
metadata:
  name: penny-dev-db-lb
  namespace: penny-dev
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: penny-dev-db
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
