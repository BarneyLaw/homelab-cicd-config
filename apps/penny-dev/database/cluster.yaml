# apps/penny-dev/database/cluster.yaml
#
# Reachable from outside the cluster at penny-dev.lab.packetcraft.dev:5432 via
# the LoadBalancer in lb-service.yaml. See README.md for the connection recipe
# and for the Cloudflare record that name depends on.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: penny-dev-db
  namespace: penny-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0

  storage:
    size: 10Gi
    storageClass: longhorn

  bootstrap:
    initdb:
      database: penny
      owner: penny
      secret:
        name: penny-dev-db-app

  enableSuperuserAccess: false

  certificates:
    # CNPG's generated server certificate is issued for the in-cluster service
    # names only (CN=penny-dev-db-rw, plus the -r/-ro/-rw .svc variants), so a
    # client dialling the public hostname gets a name mismatch and cannot use
    # sslmode=verify-full. Adding the name here puts it in the SAN of the cert
    # CNPG already manages, which keeps the internal CA -- and therefore
    # streaming replication and the operator's own connections -- untouched.
    #
    # The trade is that clients must trust that internal CA: ca.crt from the
    # penny-dev-db-ca secret. README.md has the one-liner.
    serverAltDNSNames:
      - penny-dev.lab.packetcraft.dev

  postgresql:
    pg_hba:
      # K3s ServiceLB (klipper) masquerades every off-cluster connection to the
      # ingress node's flannel address, so by the time a packet reaches Postgres
      # its source always sits inside 10.42.0.0/16 -- LAN, Tailscale and
      # in-cluster traffic are indistinguishable at this layer. (Measured: a
      # connection from a Tailscale peer to 192.168.1.250:5432 arrives from
      # 10.42.0.0.) Source-IP rules cannot scope access here, which is why the
      # previous `host penny penny 192.168.1.0/24` rule never matched anything.
      #
      # Network scoping is Tailscale's job. What pg_hba has to enforce is that
      # no credential crosses the wire in the clear: CNPG appends its own
      # `host all all all scram-sha-256` after these rules, and `host` matches
      # SSL and non-SSL alike, so without this reject a client setting
      # sslmode=disable would hand its password over in plaintext.
      - hostnossl all all all reject
    parameters:
      max_connections: "50"
      log_min_duration_statement: "500"

  monitoring:
    enablePodMonitor: true
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cluster
        action: replace

  affinity:
    nodeSelector:
      kubernetes.io/hostname: nebula

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Propagated by SetInheritedDataAndOwnership() onto every object the operator
  # creates for this cluster -- including the generated PodMonitor, which is the
  # only reason this is here. kube-prom's podMonitorSelector requires
  # release=kube-prom and CNPG does not otherwise set it, so the PodMonitor is
  # created, ArgoCD reports Synced, and nothing scrapes it.
  #
  # Side effect: the label also lands on pods, services, PVCs and secrets.
  inheritedMetadata:
    labels:
      release: kube-prom
