apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: penny-dev-db
  namespace: penny-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0

  storage:
    size: 10Gi
    storageClass: longhorn

  bootstrap:
    initdb:
      database: penny
      owner: penny
      secret:
        name: penny-dev-db-app

  enableSuperuserAccess: false

  postgresql:
    pg_hba:
      - host penny penny 10.42.0.0/16 scram-sha-256
      - host penny penny 192.168.1.0/24 scram-sha-256
    parameters:
      max_connections: "50"
      log_min_duration_statement: "500"

  monitoring:
    enablePodMonitor: true

  affinity:
    nodeSelector:
      kubernetes.io/hostname: nebula

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
    # Propagated by SetInheritedDataAndOwnership() onto every object the operator
  # creates for this cluster — including the generated PodMonitor, which is the
  # only reason this is here. kube-prom's podMonitorSelector requires
  # release=kube-prom and CNPG does not otherwise set it, so the PodMonitor is
  # created, ArgoCD reports Synced, and nothing scrapes it.
  #
  # Side effect: the label also lands on pods, services, PVCs and secrets.
  inheritedMetadata:
    labels:
      release: kube-prom

  monitoring:
    enablePodMonitor: true