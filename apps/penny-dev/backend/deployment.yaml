apiVersion: apps/v1
kind: Deployment
metadata:
  name: penny-backend
  namespace: penny-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penny-backend
  template:
    metadata:
      labels:
        app: penny-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: deus
      containers:
        - name: backend
          image: ghcr.io/barneylaw/penny-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PGHOST
              value: penny-dev-db-rw.penny-dev.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: penny
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: penny-dev-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: penny-dev-db-app
                  key: password
            # pg_hba rejects hostnossl outright (see database/cluster.yaml).
            # libpq's default sslmode=prefer would negotiate TLS anyway, but
            # `require` makes the dependency explicit and fails loudly rather
            # than silently if TLS ever stops being offered.
            - name: PGSSLMODE
              value: require
            - name: APP_ENV
              value: development
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
