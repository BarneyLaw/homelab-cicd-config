apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # No nodeSelector -- stateless, nothing holds it to a particular node.
      containers:
        - name: nginx
          image: ghcr.io/barneylaw/nginx-app:latest  # tag rewritten by CI
          ports:
            - containerPort: 80
