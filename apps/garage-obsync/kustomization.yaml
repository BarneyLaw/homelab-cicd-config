apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsync

resources:
  - namespace.yaml
  - sealed-secret.yaml      # generated by kubeseal — see README step 1.
                            # A missing file makes kustomize build fail loudly
                            # and ArgoCD go Unknown. That is the correct failure
                            # mode; a placeholder would sync Healthy and then
                            # CrashLoop on decrypt.
  - statefulset.yaml
  - service.yaml
  - servicemonitor.yaml

# garage.toml is a generator, not a committed ConfigMap, specifically because
# it is mounted with subPath. A subPath mount is a one-time copy: editing a
# plain ConfigMap would never reach the running container, and nothing would
# tell you. The hash suffix changes the pod spec on every config edit, so a
# commit to garage.toml produces a real rolling restart.
configMapGenerator:
  - name: garage-config
    files:
      - garage.toml

# `pairs` without includeSelectors, so this only touches metadata.labels. A
# StatefulSet's spec.selector is immutable; a transformer that rewrote it would
# make every future sync fail on a forbidden-field update.
labels:
  - pairs:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: garage-obsync
      app.kubernetes.io/part-of: obsync
      app.kubernetes.io/managed-by: argocd