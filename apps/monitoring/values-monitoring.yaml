prometheus-node-exporter:
  extraArgs:
  - --collector.hwmon
  - --collector.thermal_zone
  - --collector.rapl
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
  daemonsetAnnotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
prometheus:
  prometheusSpec:
    # PERSISTENT STORAGE -- added 2026-09-20. Before this, spec.storage was unset,
    # so the TSDB lived in an emptyDir and every restart wiped all history.
    #
    # That was not a theoretical problem. The kured patching outage was detected
    # by KuredNodeStuckCordoned, whose `for: 45m` survived, but
    # KuredRebootPendingTooLong (`for: 8d`) never once matured in three weeks --
    # because the Sunday drain evicted Prometheus and reset the clock. The pod
    # was recreated at 2026-09-19T18:00:25Z, the same minute the reboot window
    # opened. The outage was erasing its own evidence, weekly. Any alert with a
    # multi-day `for:` is meaningless without this volume.
    #
    # SIZING (measured 2026-09-20, not guessed)
    #   10,094 samples/sec, 325,927 active series, 10d retention.
    #   10 * 86400 * 10094 * ~2 bytes/sample = ~17.4 GB, doubled for block
    #   compaction overhead and series growth = ~35 GB. 40Gi with retentionSize
    #   capped below it so Prometheus prunes before the disk can fill: a full
    #   TSDB volume wedges Prometheus, which would take the alerting with it.
    #   Re-measure with prometheus_tsdb_head_series before changing retention.
    retention: 10d
    retentionSize: 30GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi

    # DO NOT give Prometheus a PodDisruptionBudget. It now holds a Longhorn RWO
    # volume, so it is exactly the shape of workload that broke patching: a pod
    # that cannot be evicted keeps its volume attached, which keeps Longhorn's
    # instance-manager PDB in place, which fails the drain, which wedges kured's
    # lock cluster-wide. See "WHY DRAINS MUST BE ABLE TO SUCCEED" in
    # apps/kured/values.yaml. Prometheus being briefly unavailable during a
    # Sunday reboot is fine; the volume is what preserves the history.

alertmanager:
  alertmanagerSpec:
    # The entire routing tree lives in
    # apps/monitoring-extras/alertmanagerconfig.yaml as an AlertmanagerConfig CR,
    # pointed at here so it is the GLOBAL config rather than a namespace-scoped
    # one. That file explains why, but the short version: Discord's webhook URL
    # is a credential, and the raw `alertmanager.config` path cannot read one
    # from a Secret -- Prometheus Operator v0.90.1's discordConfig struct has
    # only `webhook_url`, no webhook_url_file. The CRD's discordConfigs.apiURL is
    # a SecretKeySelector, which can.
    #
    # The chart's own default alertmanager.config (one receiver, "null") is
    # deliberately left alone below; the operator ignores it while
    # alertmanagerConfiguration is set. If this reference is ever removed,
    # alerting silently reverts to discarding everything -- which is exactly how
    # the 2026-09 kured outage went unnoticed for three weeks. Check with:
    #   kubectl -n monitoring get secret \
    #     alertmanager-kube-prom-kube-prometheus-alertmanager-generated \
    #     -o jsonpath='{.data.alertmanager\.yaml\.gz}' | base64 -d | gunzip
    # and confirm a `discord` receiver is present.
    alertmanagerConfiguration:
      name: homelab

# ---- K3s: components that are not separately scrapeable -------------------
# KubeProxyDown / KubeControllerManagerDown / KubeSchedulerDown were firing
# permanently and notifying Discord. They are false positives, not failures.
#
# The chart assumes kubeadm, where each of these is its own pod, and creates a
# headless Service selecting component=kube-{proxy,scheduler,controller-manager}
# in kube-system plus a ServiceMonitor on 10249/10259/10257. Under K3s all three
# are compiled into the single k3s process, so no such pod exists, the selector
# matches nothing, the job reports 0 targets, and absent(up{job=...}) is true
# forever. Verified 2026-09-20: 0 targets each, while job=kubelet had 15 and
# job=apiserver had 3.
#
# Each of these flags gates the Service, the ServiceMonitor AND the alert rule
# group (the groups are guarded on `.Values.<component>.enabled`), so this one
# change removes the alerts rather than merely muting them.
#
# WHY NOT SCRAPE THEM, THE WAY scrapeconfig-etcd.yaml DOES FOR ETCD
#   It is possible -- bind-address=0.0.0.0 via kube-controller-manager-arg /
#   kube-scheduler-arg / kube-proxy-arg in /etc/rancher/k3s/config.yaml, a k3s
#   restart on each server, a ufw rule, and static-target ScrapeConfigs -- but it
#   buys very little here. Unlike etcd, these three are not independently
#   failable on K3s: they live in the same process as the apiserver, so if they
#   die, k3s is down, which job=apiserver, node Ready and the etcd alerts already
#   catch. etcd earned its ScrapeConfig because a member CAN lose quorum while
#   k3s keeps serving; these cannot.
#
#   Leaving a permanently-firing critical alert in place is the worse option: it
#   trains everyone to ignore the channel, which is the failure mode the
#   Alertmanager work in this same file exists to fix.
kubeProxy:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
