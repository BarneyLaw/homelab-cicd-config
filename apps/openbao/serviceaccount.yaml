# The pod's own ServiceAccount, and the one binding OpenBao actually needs.
#
# system:auth-delegator grants TokenReview + SubjectAccessReview. That is what
# the Kubernetes auth method uses to verify a client's ServiceAccount token:
# an app presents its projected SA token, OpenBao asks the API server "is this
# real, and whose is it?", and issues a lease-bound OpenBao token in return.
# Without this binding `bao write auth/kubernetes/login` fails with a 403 from
# the API server, not from OpenBao, which is a confusing way to find out.
#
# This is the whole point of the deployment: apps authenticate with an identity
# the cluster already gave them, so no encrypted blob has to sit in git.
#
# Nothing here grants OpenBao any read access to Secrets or other objects. It
# can only ask "who is this token", which is why auth-delegator is safe to hand
# out and is the exact binding the upstream chart uses.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
