# Scrapes /v1/sys/metrics, which needs two things that are easy to miss:
#   - format=prometheus, or OpenBao answers in its native JSON telemetry format
#     and the scrape fails to parse
#   - unauthenticated_metrics_access in the listener's telemetry stanza (set in
#     configmap.yaml), or every scrape gets a 403 for want of a token
#
# A sealed OpenBao returns 503 here, so the target goes down. That is not a
# defect -- prometheusrule.yaml leans on it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao
  namespace: openbao
  labels:
    # Must match kube-prom's serviceMonitorSelector. Verify with:
    #   kubectl get prometheus -n monitoring -o jsonpath='{.items[0].spec.serviceMonitorSelector}'
    release: kube-prom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      # Front door only. openbao-internal carries the same app.kubernetes.io
      # labels and would otherwise be scraped as a second target for the same
      # pods, under a second job name.
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      interval: 30s
      scrapeTimeout: 10s
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
