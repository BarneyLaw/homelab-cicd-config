# Lives in the monitoring namespace even though the openbao Application targets
# `openbao` -- same placement as the Traefik, Longhorn and cloudflared rules.
#
# METRIC NAMES ARE NOT YET VERIFIED AGAINST A LIVE POD. OpenBao inherited Vault's
# telemetry and is midway through renaming the `vault_` prefix, so which of
# `vault_core_unsealed` / `bao_core_unsealed` this build emits is a coin flip.
# The two rules below deliberately use only `up`, which is generated by
# Prometheus itself and cannot be wrong. Richer rules are staged at the bottom,
# commented out, to be enabled after confirming the names with:
#
#   kubectl exec -n openbao openbao-0 -- \
#     wget -qO- 'http://127.0.0.1:8200/v1/sys/metrics?format=prometheus' | grep -i unsealed
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openbao-rules
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
    - name: openbao.alerts
      rules:
        # Covers sealed AND down with one expression, because a sealed OpenBao
        # answers 503 on the metrics endpoint and the target drops. Conflating
        # them is fine: both mean every secret read in the cluster is failing and
        # both need a human with the unseal shares. The two are told apart in one
        # command, which is why the annotation names it.
        #
        # 10m rather than 5m: a `kubectl delete pod` for an image bump produces
        # this legitimately, and the operator doing it is already looking.
        - alert: OpenBaoSealedOrDown
          expr: up{job="openbao"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao {{ $labels.pod }} is sealed or down"
            description: >-
              Every client reading secrets from OpenBao is failing. Tell the two
              apart with `kubectl exec -n openbao openbao-0 -- bao status`: a
              sealed pod is running and needs unseal shares, a down pod needs
              the logs. Nothing restarts its way out of a seal.

        # Canary. When the pod is deleted outright the `up` series disappears
        # instead of going to 0, so the alert above goes silent rather than
        # firing. Also catches the ServiceMonitor losing its release=kube-prom
        # label on a chart upgrade.
        - alert: OpenBaoMetricsMissing
          expr: absent(up{job="openbao"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "OpenBao metrics absent from Prometheus"
            description: >-
              Either no OpenBao pod exists or the ServiceMonitor is no longer
              selected by kube-prom. Compare the ServiceMonitor labels against
              the Prometheus serviceMonitorSelector.

        # GATED -- enable once the metric name above is confirmed. This is the
        # rule that distinguishes "sealed" from "down", which OpenBaoSealedOrDown
        # cannot. Fix the prefix to whatever the pod actually emits.
        #
        # - alert: OpenBaoSealed
        #   expr: vault_core_unsealed == 0
        #   for: 10m
        #   labels:
        #     severity: critical
        #   annotations:
        #     summary: "OpenBao {{ $labels.pod }} is sealed"

        # GATED -- only meaningful at three replicas, and only after confirming
        # the name. At one replica there is no leader election to lose.
        #
        # - alert: OpenBaoNoLeader
        #   expr: sum(vault_core_active) == 0
        #   for: 5m
        #   labels:
        #     severity: critical
        #   annotations:
        #     summary: "OpenBao raft cluster has no active node"
