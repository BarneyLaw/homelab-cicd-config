# Remember: the argocd/ directory is not watched by any app-of-apps.
# This needs a manual `kubectl apply -f argocd/garage-obsync.yaml`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-obsync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BarneyLaw/homelab-cicd-config.git
    targetRevision: main
    path: apps/garage-obsync
  destination:
    server: https://kubernetes.default.svc
    namespace: obsync
  syncPolicy:
    automated:
      # prune: true is safe despite this being a data store. The meta and data
      # volumes come from the StatefulSet's volumeClaimTemplates, which Argo
      # does not own and therefore cannot prune: a bad revert deletes the
      # workload and leaves the PVCs for the next sync to re-attach. Same
      # reasoning as openbao, opposite of seafile's adopted PVs.
      prune: true
      # selfHeal reverts hand-edits. Note what it does NOT cover: the cluster
      # layout lives in Garage's own metadata, not in any Kubernetes object, so
      # `garage layout assign` is invisible to git. Synced/Healthy here means
      # the pods match the manifests, not that the layout is correct.
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true