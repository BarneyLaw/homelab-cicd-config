apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.23.x   # pin to current stable
      helm:
        releaseName: cnpg      # match existing release → adopt, not duplicate
        values: |
          # No nodeSelector. The operator is a stateless reconciler; pinning it
          # meant a deus reboot froze CNPG reconciliation cluster-wide (running
          # Postgres pods survive, but failover and switchover do not).
          monitoring:
            # Operator's own controller-runtime metrics. The chart exposes
            # podMonitorAdditionalLabels specifically so the generated
            # PodMonitor can satisfy kube-prom's podMonitorSelector.
            podMonitorEnabled: true
            podMonitorAdditionalLabels:
              release: kube-prom
          # The chart CAN create the CNPG Grafana dashboard, but it lands in
          # cnpg-system and our Grafana sidecar only watches `monitoring`.
          # Dashboard goes through monitoring-extras instead. Leave this false.

    - repoURL: https://github.com/BarneyLaw/homelab-cicd-config.git
      targetRevision: main
      path: apps/cnpg-extras

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true