# argocd/kured.yaml
#
# Pattern B + values ref, same shape as longhorn.yaml / headlamp.yaml:
# upstream chart as source 1, this repo as a ref-only source for $values.
#
# Reminder: nothing watches argocd/, so this needs `kubectl apply -f` by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubereboot.github.io/charts
      chart: kured
      targetRevision: 6.1.0          # appVersion 1.23.0
      helm:
        releaseName: kured
        valueFiles:
          - $values/apps/kured/values.yaml

    # ref-only source: provides $values above. No `path`, nothing rendered.
    - repoURL: https://github.com/BarneyLaw/homelab-cicd-config.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
